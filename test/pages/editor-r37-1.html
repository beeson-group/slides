<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Editor video and QR deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- the deck of the tests of R37.1: one video without a pair, played while its slide is shown, after a list of two steps, one video without a pair that is a step played at its step, and a QR code drawn with the logo -->
<div class="reveal">
<div class="slides">

<section>
  <h2>One clip</h2>
  <ul>
    <li class="fragment" data-fragment-index="1">A first point.</li>
    <li class="fragment" data-fragment-index="2">A second point.</li>
  </ul>
  <div class="figure-box">
    <video src="../../demo/clip-dark.mp4" poster="../../demo/clip-dark.png" muted loop data-autoplay></video>
  </div>
</section>

<section>
  <h2>One clip at a step</h2>
  <p>A paragraph.</p>
  <div class="figure-box">
    <video class="fragment" data-fragment-index="1" src="../../demo/clip-dark.mp4" poster="../../demo/clip-dark.png" muted loop data-autoplay></video>
  </div>
</section>

<section>
  <h2>A code</h2>
  <p>A paragraph.</p>
  <div class="qr" data-qr="https://github.com/beeson-group/slides"></div>
</section>

</div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
