<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Editor empty zone deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
<script src="../../theme/macros.js"></script>
<script src="../../theme/mathjax-config.js"></script>
<script src="../../theme/vendor/mathjax/tex-svg.js"></script>
</head>
<body>
<!-- the empty zones of the placeholder tests of the editor: a split slide and a content slide, each
     with a zone without content, and a figure slide with an empty plate -->
<div class="reveal">
<div class="slides">

<section class="split">
  <div class="panel">
    <h2>A split slide</h2>
    <p>Words in the black panel.</p>
  </div>
  <div class="zone"></div>
</section>

<section>
  <h2>A content slide</h2>
  <p>A paragraph beside an empty zone.</p>
  <div class="zone">
  </div>
</section>

<section class="figure">
  <h2>A figure slide</h2>
  <div class="plate"></div>
  <p class="caption">A caption over an empty plate.</p>
</section>

</div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
