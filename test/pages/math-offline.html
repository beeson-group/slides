<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Math offline check</title>
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<style>
  body { font-family: 'STIX Two Text', serif; font-size: 28px; margin: 32px; background: #fff; color: #141413; }
  #status { font-family: monospace; font-size: 16px; color: #555; }
</style>
<script src="../../theme/macros.js"></script>
<script src="../../theme/mathjax-config.js"></script>
<script>
  // the page reports in #status whether MathJax typeset with the STIX Two Math font
  window.MathJax.startup = {
    pageReady() {
      return MathJax.startup.defaultPageReady().then(() => {
        const font = MathJax.config.output.font;
        const svgs = document.querySelectorAll('mjx-container[jax="SVG"]').length;
        const errors = document.querySelectorAll('mjx-merror').length;
        const faces = [...document.fonts].filter((f) => f.status === 'loaded').length;
        document.getElementById('status').textContent = `typeset ${svgs} formulas, font ${font}, ${errors} errors, ${faces} text faces loaded`;
        console.log(`math-offline: font=${font} formulas=${svgs} errors=${errors} faces=${faces}`);
      }).catch((error) => console.error(`math-offline: ${error.message}`));
    },
  };
</script>
<script src="../../theme/vendor/mathjax/tex-svg.js"></script>
</head>
<body>
<p>The collinear point \(L_1\) of the Earth–Moon system, in italic <em>STIX Two Text</em>.</p>
\[\ddot x - 2\dot y = \partial U/\partial x,\quad \mu = 0.01215\]
<p>Macros: \(\vb{r} \in \R^3\) and \(\int_0^T f(t) \dd t\).</p>
<p id="status">MathJax did not finish.</p>
</body>
</html>
