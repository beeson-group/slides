<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>The normal form</title>
    <link rel="stylesheet" href="../../theme/vendor/reveal/reset.css" />
    <link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css" />
    <link rel="stylesheet" href="../../theme/beeson.css" />
    <script>
      window.warnings = [];
      const warn = console.warn.bind(console);
      console.warn = (...args) => {
        window.warnings.push(args.join(' '));
        warn(...args);
      };
    </script>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section class="section">
          <h2>The normal form on a section slide</h2>
          <div class="backdrop" data-backdrop="normalForm" style="width: 885px; height: 1080px"></div>
        </section>
        <section>
          <h2>The normal form on a slide</h2>
          <div class="backdrop" data-backdrop="normalForm"></div>
        </section>
      </div>
    </div>
    <script src="../../theme/vendor/reveal/reveal.js"></script>
    <script src="../../theme/beeson.js"></script>
    <script>
      Beeson.start({});
    </script>
  </body>
</html>
