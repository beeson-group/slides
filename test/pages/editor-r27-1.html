<body>
<!-- the deck of the tests of R27.1: an empty content slide to draw on, a slide of two boxes joined by an attached curved arrow with a third box, a text moved as a box, a text in the flow, and a loose line, a slide of a group joined to a box, and a slide of two boxes 8 px apart, the lower one first in the file -->
<div class="reveal">
<div class="slides">

<section>
  <h2>Empty</h2>
  <aside class="notes">Notes of the empty slide.</aside>
</section>

<section>
  <h2>Glued</h2>
  <p>A paragraph in the flow.</p>
  <p style="width: 300px; translate: 0px 420px">Moved words</p>
  <div class="shape rounded" style="width: 241px; height: 148px; translate: 279px 463px" data-anchor="a1"><p>Goal</p></div>
  <div class="shape rounded" style="width: 241px; height: 148px; translate: 1186px 463px" data-anchor="a2"></div>
  <div class="shape ellipse" style="width: 240px; height: 160px; translate: 1186px 800px"></div>
  <svg class="line" width="666" height="83" style="translate: 520px 454px" data-from="a1 1 0.5" data-to="a2 0 0.5"><defs><marker id="line-1" orient="auto-start-reverse"><path d="M-4-2.5 1 0-4 2.5z"></path></marker></defs><path d="M0 83 Q333 -83 666 83" marker-end="url(#line-1)"></path></svg>
  <svg class="line" width="400" height="1" style="translate: 700px 950px"><defs><marker id="line-2" orient="auto-start-reverse"><path d="M-4-2.5 1 0-4 2.5z"></path></marker></defs><line x1="0" y1="0" x2="400" y2="0"></line></svg>
</section>

<section>
  <h2>Grouped</h2>
  <div class="shape" style="width: 200px; height: 120px; translate: 200px 400px" data-group="g1" data-anchor="a1"></div>
  <div class="shape" style="width: 200px; height: 120px; translate: 200px 600px" data-group="g1"></div>
  <div class="shape" style="width: 200px; height: 120px; translate: 1200px 400px" data-anchor="a2"></div>
  <svg class="line" width="800" height="1" style="translate: 400px 460px" data-from="a1 1 0.5" data-to="a2 0 0.5"><defs><marker id="line-3" orient="auto-start-reverse"><path d="M-4-2.5 1 0-4 2.5z"></path></marker></defs><line x1="0" y1="0" x2="800" y2="0" marker-end="url(#line-3)"></line></svg>
</section>

<section>
  <h2>Stack</h2>
  <div class="shape" style="width: 300px; height: 120px; translate: 300px 600px"></div>
  <div class="shape" style="width: 300px; height: 120px; translate: 300px 472px"></div>
</section>

</div>
</div>
