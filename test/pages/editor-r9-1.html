<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>A group of two figures</title>
  <link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
  <link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
  <link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section>
      <h2>A group of two pairs</h2>
      <figure class="zone" data-group="g1">
        <img class="for-dark" style="width: 300px" src="../../demo/figure-dark.png" alt="A first figure, dark version">
        <img class="for-light" style="width: 300px" src="../../demo/figure-light.png" alt="A first figure, light version">
      </figure>
      <figure class="zone" data-group="g1" style="translate: -400px 300px">
        <img class="for-dark" style="width: 300px" src="../../demo/figure-dark.png" alt="A second figure, dark version">
        <img class="for-light" style="width: 300px" src="../../demo/figure-light.png" alt="A second figure, light version">
      </figure>
    </section>
  </div></div>
  <script src="../../theme/vendor/reveal/reveal.js"></script>
  <script src="../../theme/vendor/reveal/notes.js"></script>
  <script src="../../theme/beeson.js"></script>
  <script>Beeson.start({});</script>
</body>
</html>
