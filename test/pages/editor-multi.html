<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Several resizable elements</title>
  <link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
  <link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
  <link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section>
      <h2>A QR code, a paragraph, and a figure</h2>
      <p>A paragraph next to a QR code.</p>
      <div class="qr" data-qr="https://example.com/x.pdf" style="width: 240px"></div>
      <figure class="figure-box">
        <img class="for-dark" src="../../demo/figure-dark.png" alt="A figure, dark version">
        <img class="for-light" src="../../demo/figure-light.png" alt="A figure, light version">
      </figure>
    </section>
  </div></div>
  <script src="../../theme/vendor/reveal/reveal.js"></script>
  <script src="../../theme/vendor/reveal/notes.js"></script>
  <script src="../../theme/beeson.js"></script>
  <script>Beeson.start({});</script>
</body>
</html>
