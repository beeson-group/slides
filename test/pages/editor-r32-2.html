<!-- the deck of the tests of R32.2: a paragraph moved with a translate, and a list whose items are each moved with a translate -->
<div class="reveal">
<div class="slides">

<section>
  <h2>A moved paragraph</h2>
  <p>Words that stay in place.</p>
  <p style="translate: 0px 24px">A moved paragraph of words.</p>
  <p>More words after it.</p>
</section>

<section>
  <h2>Moved items</h2>
  <p>Words that stay in place.</p>
  <ol>
    <li style="translate: 0px 24px">Alpha</li>
    <li style="translate: 0px 24px">Beta</li>
  </ol>
  <p>More words after it.</p>
</section>

</div>
</div>
