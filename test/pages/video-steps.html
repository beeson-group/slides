<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Video deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
<!-- the largest number of videos that are loaded again at once, for the test of the print view -->
<script>
  const loading = new Set();
  window.loadedAtOnce = 0;
  document.addEventListener('emptied', (event) => {
    loading.add(event.target);
    window.loadedAtOnce = Math.max(window.loadedAtOnce, loading.size);
  }, true);
  document.addEventListener('loadeddata', (event) => loading.delete(event.target), true);
</script>
</head>
<body>
<!-- a video without a poster on a slide of three steps, which is cloned for each step in the print
     view of reveal.js. thus the clones start to load after the load event of the page -->
<div class="reveal">
  <div class="slides">
    <section>
      <h2>A clip in a zone</h2>
      <p class="fragment">First step</p>
      <p class="fragment">Second step</p>
      <div class="figure-box"><video src="../../demo/clip-dark.mp4"></video></div>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
