<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Nested groups</title>
  <link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
  <link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
  <link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section>
      <h2>Nested groups</h2>
      <p>A paragraph beside the figures</p>
      <figure class="figure-box" data-group="g1">
        <img style="width: 200px" src="../../demo/figure-dark.png" alt="A first figure">
      </figure>
      <figure class="figure-box" data-group="g1" style="translate: -300px 100px">
        <img style="width: 200px" src="../../demo/figure-dark.png" alt="A second figure">
      </figure>
      <figure class="figure-box" style="translate: -600px 200px">
        <img style="width: 200px" src="../../demo/figure-dark.png" alt="A third figure">
      </figure>
    </section>
    <section>
      <h2>Turns and layers</h2>
      <ul>
        <li>One</li>
        <li>Two</li>
      </ul>
      <figure class="figure-box">
        <img style="width: 200px; rotate: 30deg" src="../../demo/figure-dark.png" alt="A turned figure">
      </figure>
      <figure class="figure-box" style="translate: -300px 300px">
        <img style="width: 200px" src="../../demo/figure-dark.png" alt="A straight figure">
      </figure>
    </section>
    <section>
      <h2>A diagram with an arrow</h2>
      <p>A paragraph above the arrow</p>
      <figure class="figure-box">
        <img style="width: 200px" src="../../demo/figure-dark.png" alt="A figure at the arrow">
      </figure>
      <svg class="line" width="300" height="1" style="translate: 600px 700px"><defs><marker id="r20-7-arrow" orient="auto-start-reverse"><path d="M-4-2.5 1 0-4 2.5z"></path></marker></defs><line x1="0" y1="0" x2="300" y2="0" marker-end="url(#r20-7-arrow)"></line></svg>
    </section>
  </div></div>
  <script src="../../theme/vendor/reveal/reveal.js"></script>
  <script src="../../theme/vendor/reveal/notes.js"></script>
  <script src="../../theme/beeson.js"></script>
  <script>Beeson.start({});</script>
</body>
</html>
