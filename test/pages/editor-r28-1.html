<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Editor layers and pastes deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
<script src="../../theme/macros.js"></script>
<script src="../../theme/mathjax-config.js"></script>
<script src="../../theme/vendor/mathjax/tex-svg.js"></script>
</head>
<body>
<!-- the deck of the tests of R28.1: a shape far from the place of a new text box, a shape over this place, and a shape and an arrow copied onto two other slides -->
<div class="reveal">
<div class="slides">

<section>
  <h2>Far</h2>
  <p>Column words here.</p>
  <div class="shape tone-blue" style="width: 300px; height: 200px; translate: 1200px 400px"><p>Far</p></div>
</section>

<section>
  <h2>Near</h2>
  <p>Column words here.</p>
  <div class="shape tone-blue" style="width: 1760px; height: 800px; translate: 80px 200px"></div>
</section>

<section>
  <h2>Source</h2>
  <p>Some words.</p>
  <div class="shape tone-blue" style="width: 300px; height: 200px; translate: 1200px 300px"><p>Box</p></div>
  <svg class="line" width="300" height="1" style="translate: 1200px 700px"><defs><marker id="r28-arrow" orient="auto-start-reverse"><path d="M-4-2.5 1 0-4 2.5z"></path></marker></defs><line x1="0" y1="0" x2="300" y2="0" marker-end="url(#r28-arrow)"></line></svg>
</section>

<section>
  <h2>Target</h2>
  <p>Other words.</p>
</section>

<section>
  <h2>Third</h2>
  <p>More words.</p>
</section>

</div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
