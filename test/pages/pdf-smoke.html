<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF smoke deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<style>
  .reveal { font-family: 'STIX Two Text', serif; font-size: 48px; color: #141413; }
  .reveal-viewport { background: #faf9f5; }
</style>
</head>
<body>
<!-- three top-level slides, the third a vertical stack of two, and two fragments on the second.
     scripts/check.mjs thus finds 4 slides, and scripts/export-pdf.mjs 6 pages -->
<div class="reveal">
  <div class="slides">
    <section><h1>Smoke deck</h1></section>
    <section>
      <h2>Fragments</h2>
      <p class="fragment">First fragment</p>
      <p class="fragment">Second fragment</p>
    </section>
    <section>
      <section><h2>Vertical stack, top</h2></section>
      <section><h2>Vertical stack, bottom</h2></section>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script>
  Reveal.initialize({
    width: 1920,
    height: 1080,
    margin: 0,
    hash: true,
    pdfSeparateFragments: true,
    plugins: [RevealNotes],
  });
</script>
</body>
</html>
