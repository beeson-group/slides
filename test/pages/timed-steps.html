<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Timed steps deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- steps that start After Previous, written as data-autoslide on a fragment of the step before:
     two timed steps after a click on the second slide, and a delay on the last step of the third
     slide, which moves on to the fourth slide -->
<div class="reveal">
  <div class="slides">
    <section>
      <h2>First</h2>
      <p>The first slide.</p>
    </section>
    <section>
      <h2>Timed</h2>
      <p class="fragment" data-fragment-index="1" data-autoslide="300">Click</p>
      <p class="fragment" data-fragment-index="2" data-autoslide="300">Timed one</p>
      <p class="fragment" data-fragment-index="3">Timed two</p>
      <p class="fragment" data-fragment-index="4">Click again</p>
    </section>
    <section>
      <h2>Last step</h2>
      <p class="fragment" data-fragment-index="1" data-autoslide="300">Moves on</p>
    </section>
    <section>
      <h2>After</h2>
      <p>The slide after.</p>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
