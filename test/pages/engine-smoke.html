<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engine smoke test</title>
<link rel="stylesheet" href="../../node_modules/reveal.js/dist/reveal.css">
<style>
  :root { --accent: #f08050; --stroke: rgba(242, 242, 239, 0.25); --body: rgba(242, 242, 239, 0.6); background: #141413; color: #f2f2ef; }
  :root[data-theme="light"] { --accent: #c8571e; --stroke: rgba(20, 20, 19, 0.2); --body: rgba(20, 20, 19, 0.5); background: #f7f6f2; color: #141413; }
  .reveal-viewport { background: inherit; color: inherit; }
  .reveal .slides section { height: 1080px; }
  .backdrop { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .backdrop canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .label { position: absolute; transform: translate(-50%, -50%); font: italic 22px serif; }
  .run { position: absolute; left: 80px; top: 40px; font-size: 24px; }
  h2 { position: absolute; left: 80px; top: 120px; margin: 0; }
</style>
</head>
<body>
<div class="reveal"><div class="slides">
  <section class="section">
    <div class="backdrop" data-backdrop="tubes" data-cx="1.0" data-cy="0" data-half="0.58">
      <span class="label" data-at="L1" data-dy="-30">L1</span><span class="label" data-at="L2" data-dy="-30">L2</span><span class="label" data-at="moon" data-dy="36">Moon</span>
    </div>
    <h2>Families</h2>
  </section>
  <section>
    <div class="backdrop" data-backdrop="manifold" data-cx="0.85" data-cy="0" data-half="0.52">
      <span class="label" data-at="L1" data-dy="-30">L1</span><span class="label" data-at="moon" data-dy="36">Moon</span>
    </div>
    <p class="fragment">one</p>
  </section>
  <section>
    <div class="backdrop" data-backdrop="l2" data-cx="1.15" data-cy="0" data-half="0.5">
      <span class="label" data-at="L2" data-dy="-30">L2</span><span class="label" data-at="moon" data-dy="36">Moon</span>
    </div>
  </section>
  <section data-auto-animate>
    <div class="backdrop" data-id="glide" data-backdrop="mark" data-cx="0.988" data-cy="0" data-half="0.15" data-loop style="left: 1200px; top: 120px; width: 600px; height: 800px;"></div>
  </section>
  <section data-auto-animate>
    <div class="backdrop" data-id="glide" data-backdrop="mark" data-cx="0.988" data-cy="0" data-half="0.15" data-loop></div>
  </section>
</div></div>
<script src="../../node_modules/reveal.js/dist/reveal.js"></script>
<script src="../../node_modules/reveal.js/dist/plugin/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>
  window.addEventListener('error', (e) => console.error('SMOKE-ERROR', e.message));
  Reveal.on('pdf-ready', () => setTimeout(() => console.log('PDF', Beeson.backdrops.length, document.querySelectorAll('.pdf-page').length, document.querySelectorAll('.backdrop canvas').length, Beeson.backdrops.every((o) => o.done)), 200));
  Beeson.start({ hash: true }).then(() => {
    setTimeout(() => {
      const b = Beeson.backdrops;
      console.log('SMOKE', JSON.stringify({ version: Beeson.version, theme: Beeson.theme.get(), backdrops: b.length, done: b.map((o) => o.done),
        runs: [...document.querySelectorAll('.run')].map((r) => r.textContent), complete: Reveal.getCurrentSlide().hasAttribute('data-complete'),
        canvases: document.querySelectorAll('.backdrop canvas').length, button: !!document.querySelector('.reveal > .theme-switch') }));
      if (/drive/.test(location.search)) {
        Beeson.theme.toggle();
        Reveal.triggerKey(80);
        document.dispatchEvent(new PointerEvent('pointermove', { clientX: 1000, clientY: 540, bubbles: true }));
        Reveal.next(); Reveal.next(); Reveal.prev();
        setTimeout(() => console.log('DRIVE', JSON.stringify({ theme: Beeson.theme.get(), stored: localStorage.getItem('beeson-theme'), dot: !!document.querySelector('.pointer-dot'),
          slide: Reveal.getIndices().h, complete: Reveal.getCurrentSlide().hasAttribute('data-complete'), done: Beeson.backdrops.map((o) => o.done) })), 500);
      }
    }, 300);
  });
</script>
</body>
</html>
