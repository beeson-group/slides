<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>A group around a figure</title>
  <link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
  <link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
  <link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section>
      <h2>A group around a figure</h2>
      <figure class="figure-box" data-group="g1">
        <img style="width: 200px" src="../../demo/figure-dark.png" alt="A first figure">
        <figcaption class="caption">A</figcaption>
      </figure>
      <figure class="figure-box" style="translate: -300px 0px">
        <img style="width: 200px" src="../../demo/figure-dark.png" alt="A second figure">
        <figcaption class="caption">B</figcaption>
      </figure>
      <figure class="figure-box" data-group="g1" style="translate: -600px 0px">
        <img style="width: 200px" src="../../demo/figure-dark.png" alt="A third figure">
        <figcaption class="caption">C</figcaption>
      </figure>
    </section>
  </div></div>
  <script src="../../theme/vendor/reveal/reveal.js"></script>
  <script src="../../theme/vendor/reveal/notes.js"></script>
  <script src="../../theme/beeson.js"></script>
  <script>Beeson.start({});</script>
</body>
</html>
