<meta charset="utf-8">

<body>
<!-- a first drawing of demo/broucke-sample.js whose file is missing, before one whose file is
     found, for test/editor-r28-2.test.mjs -->
<div class="reveal">
<div class="slides">

<section>
  <h2>A missing file first</h2>
  <p>A paragraph beside the drawing.</p>
  <div class="backdrop" data-trajectories="missing/demo/broucke-sample.js" data-trajectories-select="frame=pulsating"></div>
</section>

<section>
  <h2>The rotating frame</h2>
  <p>A paragraph beside the drawing.</p>
  <div class="backdrop" data-trajectories="../../demo/broucke-sample.js" data-trajectories-select="frame=pulsating" data-trajectories-color="family" data-trajectories-ramp="e"></div>
</section>

<section>
  <h2>A scene</h2>
  <p>A paragraph beside the drawing.</p>
  <div class="backdrop" data-backdrop="tubes" data-cx="0.97" data-cy="0" data-half="0.5"></div>
</section>

</div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
