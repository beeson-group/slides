<body>
<!-- a deck of test/tex-check.test.mjs with the four problems that npm run check names: a macro that
     is not defined, a citation of a key that is not in the bibliography, a theorem of a kind that is
     not defined, and a tex.js that is not written again, since it is the one of fresh.html, which
     does not cite a paper. do not run npm run tex on this deck -->
<div class="reveal">
  <div class="slides">
    <section>
      <h2>Four problems</h2>
      <p>The macro \(\foo\) is not defined, next to \(\vb{x}\), which is.</p>
      <p>A key without an entry<cite data-key="lost1999"></cite>, and a paper cited after the tex.js was written<cite data-key="koon2000"></cite>.</p>
      <p class="theorem" data-kind="conjecture">The kind of this theorem is not defined.</p>
    </section>
  </div>
</div>
<script src="../../../theme/vendor/reveal/reveal.js"></script>
<script src="../../../theme/vendor/reveal/notes.js"></script>
<script src="../../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
