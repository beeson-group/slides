<!-- the deck test/pages/editor-r36-4.html with a drawing of demo/broucke-sample.js whose file is
     found with ../../, for test/editor-r36-4.test.mjs -->
<div class="reveal">
<div class="slides">

<section>
  <h2>A scene</h2>
  <p>A paragraph beside the drawing.</p>
  <div class="backdrop" data-scene="nest" data-cx="0.97" data-cy="0" data-half="0.5"></div>
</section>

<section>
  <h2>A content slide without a backdrop</h2>
  <p>A paragraph.</p>
</section>

<section>
  <h2>The rotating frame</h2>
  <p>A paragraph beside the drawing.</p>
  <div class="backdrop" data-strands="../../demo/broucke-sample.js" data-strands-select="frame=pulsating" data-strands-color="family" data-strands-ramp="e"></div>
</section>

</div>
</div>
