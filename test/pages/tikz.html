<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>TikZ deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- a TikZ figure of figures/two.js with the parts a and b as steps and the part c without a step,
     the same figure twice on one slide, the second time in a box smaller than its output, and a
     figure without an output -->
<div class="reveal">
  <div class="slides">
    <section>
      <h2>Before the figure</h2>
    </section>
    <section>
      <h2>A figure with two parts as steps</h2>
      <p>The part c is shown with the slide.</p>
      <div class="zone tikz" data-figure="two" style="width: 600px; height: 400px"><span class="fragment" data-part="a" data-fragment-index="1"></span><span class="fragment" data-part="b" data-fragment-index="2"></span></div>
    </section>
    <section>
      <h2>The same figure twice</h2>
      <div class="zone tikz" data-figure="two"></div>
      <div class="tikz" data-figure="two" style="width: 150px; height: 50px"></div>
    </section>
    <section>
      <h2>A figure without its output</h2>
      <div class="zone tikz" data-figure="missing"></div>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});
// the editor is installed on a started deck, hence reveal.js is started before the outputs of the figures are loaded
window.startedAtOnce = typeof Reveal.layout === 'function' && !window.beesonFigures;</script>
</body>
</html>
