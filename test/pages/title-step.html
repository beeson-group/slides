<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Title step deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- a title slide whose backdrop is its one step, hence the words are shown first and the transfer
     of the group logo is traced at the first step -->
<div class="reveal">
  <div class="slides">
    <section class="title">
      <div class="backdrop fragment" data-fragment-index="1" data-trajectories="../../brand/transfer.js" data-duration="20" data-cx="-0.84" data-cy="0" data-half="1.128"></div>
      <div class="title-text">
        <h1>A title</h1>
      </div>
    </section>
    <section>
      <h2>A content slide</h2>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
