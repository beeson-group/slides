<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Numbered deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- the title and section slides are not numbered, and the two slides after the closing slide are the
     appendix, numbered A1 and A2 -->
<div class="reveal">
  <div class="slides">
    <section class="title"><div class="title-text"><h1>A title</h1></div></section>
    <section class="section"><div class="sec"><h2>Chapter one</h2></div></section>
    <section><h2>First</h2></section>
    <section><h2>Second</h2></section>
    <section class="section"><div class="sec"><h2>Chapter two</h2></div></section>
    <section><h2>Third</h2></section>
    <section class="closing"><div class="title-text"><h1>Thank you</h1></div></section>
    <section><h2>Appendix one</h2></section>
    <section><h2>Appendix two</h2></section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
