<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Recordings</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- the animated backdrops of test/record.test.mjs, each traced in 1 s, a loop, and two backdrops
     that are steps -->
<div class="reveal">
  <div class="slides">
    <section class="title">
      <div class="backdrop" data-backdrop="tubes" data-cx="0.42" data-cy="0" data-half="0.6" data-duration="1"></div>
      <div class="title-text">
        <h1>A title with steps</h1>
        <p class="sub fragment" data-fragment-index="1">A step over the trace</p>
        <p class="who fragment" data-fragment-index="2">A second step</p>
      </div>
    </section>
    <section class="closing">
      <div class="backdrop" data-backdrop="tubes" data-cx="0.42" data-cy="0" data-half="0.6" data-duration="1"></div>
      <div class="title-text">
        <h1>A closing slide</h1>
      </div>
      <div class="qr" data-qr="https://github.com/beeson-group/slides"></div>
    </section>
    <section>
      <h2>A loop</h2>
      <div class="backdrop" data-backdrop="tubes" data-cx="0.97" data-cy="0" data-half="0.5" data-loop></div>
    </section>
    <section class="title">
      <div class="backdrop fragment" data-fragment-index="1" data-backdrop="tubes" data-cx="0.42" data-cy="0" data-half="0.6" data-duration="1"></div>
      <div class="title-text">
        <h1>A trace that is a step</h1>
      </div>
    </section>
    <section>
      <h2>A still backdrop that is a step</h2>
      <div class="backdrop fragment" data-fragment-index="1" data-backdrop="tubes" data-cx="0.97" data-cy="0" data-half="0.5" data-duration="1"></div>
    </section>
    <section>
      <h2>Two traces from two steps</h2>
      <div class="backdrop" data-backdrop="tubes" data-cx="0.97" data-cy="0" data-half="0.5" data-duration="1" data-live></div>
      <div class="backdrop fragment" data-fragment-index="1" data-backdrop="tubes" data-cx="0.42" data-cy="0" data-half="0.6" data-duration="1" data-live style="left: 600px; width: 1320px"></div>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
