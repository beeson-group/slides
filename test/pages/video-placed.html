<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Placed videos</title>
  <link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
  <link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
  <link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section class="figure">
      <div class="plate">
        <video class="for-dark" src="../../demo/clip-dark.mp4" poster="../../demo/clip-dark.png" muted loop></video>
        <video class="for-light" src="../../demo/clip-light.mp4" poster="../../demo/clip-light.png" muted loop></video>
      </div>
      <h2>A plate &amp; a video</h2>
      <aside class="notes">
        The first paragraph &lt;of the notes&gt;.

        The second paragraph.
      </aside>
    </section>
    <section>
      <h2>A video in a step</h2>
      <p class="fragment" data-fragment-index="1">A paragraph.</p>
      <div class="figure-box fragment" data-fragment-index="2">
        <video src="../../demo/clip-dark.mp4" poster="../../demo/clip-dark.png"></video>
      </div>
    </section>
  </div></div>
  <script src="../../theme/vendor/reveal/reveal.js"></script>
  <script src="../../theme/vendor/reveal/notes.js"></script>
  <script src="../../theme/beeson.js"></script>
  <script>Beeson.start({});</script>
</body>
</html>
