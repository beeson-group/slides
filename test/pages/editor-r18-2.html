<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Editor caret around a list deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
<script src="../../theme/mathjax-config.js"></script>
<script src="../../theme/vendor/mathjax/tex-svg.js"></script>
</head>
<body>
<!-- the deck of the tests of R18.2: a dash list with a nested item, and a numbered list with an id -->
<div class="reveal">
<div class="slides">

<section>
  <h2>A nested item</h2>
  <ul>
    <li>None
      <ul>
        <li>Nsub</li>
      </ul>
    </li>
    <li>Ntwo</li>
  </ul>
</section>

<section>
  <h2>A list with an id</h2>
  <ol id="plan" data-id="plan">
    <li>Ione</li>
    <li>Itwo</li>
    <li>Ithree</li>
  </ol>
</section>

<section>
  <h2>A paragraph before a locked list</h2>
  <p></p>
  <ul data-locked>
    <li>Lone</li>
  </ul>
</section>

</div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
