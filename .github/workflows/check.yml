name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run typecheck
      # the Chrome preinstalled on each runner is found in scripts/chrome.mjs
      - run: npm test
      - run: npm run check
      - run: npm run pdf
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: slides-${{ matrix.os }}
          path: |
            check/*.png
            slides.pdf
          if-no-files-found: warn
