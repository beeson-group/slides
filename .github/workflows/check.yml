name: check

# a branch is checked through its pull request, hence a push is checked only on main. A round on
# any branch is started by hand under Actions > check > Run workflow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# the token of a job can only read the repository, and it is not left in the checkout
permissions:
  contents: read

# a push to a pull request cancels the round of the commit before it. A round on main has a group
# of its own, hence it is neither cancelled nor held back by a later one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# the tests and each browser are separate jobs, so that they run on separate runners at once
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # the macOS runners draw WebGL in SwiftShader, too slowly for the timings of the tests
        os: [ubuntu-latest, windows-latest]
        # the test files are split over seven runners, since the suite is over an hour long on one.
        # With the five jobs of check, 19 jobs are run at once, under the 20 of the free plan
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run typecheck
      # the tests read the demo deck, hence a talk made with "Use this template" checks only its deck
      # npm test with the shard of the job, an option that is read only before the files. With
      # --test-force-exit, a test file that leaves a server open after a failed cleanup is ended, and
      # with --test-timeout, a test file that does not end fails by name after 20 minutes
      - run: node --test --test-force-exit --test-timeout=1200000 --test-shard=${{ matrix.shard }}/7 "test/*.test.mjs"
        if: ${{ github.repository == 'beeson-group/slides' }}

  # the checks test (ubuntu-latest) and test (windows-latest) are required on main, hence the result
  # of the fourteen shards is reported under both names. Without always(), the job is skipped after a
  # failed shard, and a skipped check counts as passed
  tests:
    name: test (${{ matrix.os }})
    needs: test
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.test.result }}" = success

  # one check for the whole round, to require on main in place of the two above: it passes only if
  # every test shard and every job of check passed
  pass:
    needs: [test, check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.check.result }}" = success

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chrome }
          - { os: ubuntu-latest, browser: firefox }
          - { os: macos-latest, browser: chrome }
          - { os: macos-latest, browser: safari }
          # npm run pptx records the scene and the traced backdrops of the deck on one runner, with
          # WebGL and H.264 in software. The demo deck takes 10 minutes on Windows, 16 on Ubuntu, and
          # over 40 on macOS, hence the other two write the file without a recording
          - { os: windows-latest, browser: chrome, record: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.record && 45 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      # the Chrome preinstalled on each runner is found in scripts/chrome.mjs
      - run: npm run check
        if: ${{ matrix.browser == 'chrome' }}
      # Firefox on Linux has WebGL in software only in a window, hence Xvfb
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run check -- --browser firefox --out check/firefox
        if: ${{ matrix.browser == 'firefox' }}
      - run: sudo safaridriver --enable && npm run check -- --browser safari --out check/safari
        if: ${{ matrix.browser == 'safari' }}
      - run: npm run pdf
        if: ${{ !cancelled() && matrix.browser == 'chrome' }}
      - run: npm run pptx
        if: ${{ !cancelled() && matrix.browser == 'chrome' && matrix.record }}
      - run: npm run pptx -- --still
        if: ${{ !cancelled() && matrix.browser == 'chrome' && !matrix.record }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: slides-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            check/**/*.png
            slides.pdf
            slides.pptx
          if-no-files-found: warn
