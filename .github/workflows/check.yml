name: check

# a branch is checked through its pull request, hence a push is checked only on main
on:
  push:
    branches: [main]
  pull_request:

# the tests and each browser are separate jobs, so that they run on separate runners at once
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # the macOS runners draw WebGL in SwiftShader, too slowly for the timings of the tests
        os: [ubuntu-latest, windows-latest]
        # the test files are split over four runners, since the suite is over an hour long on one
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run typecheck
      # temporary: on a Windows runner, a file of a test page is refused about once in a run with
      # net::ERR_NO_BUFFER_SPACE, late in its shard. The processes of Chrome and node, the TCP
      # connections, and the free memory are written each minute and printed after the tests, to
      # find what is used up. Take both steps out once the cause is known
      - if: ${{ runner.os == 'Windows' && github.repository == 'beeson-group/slides' }}
        continue-on-error: true
        run: |
          $sampler = @'
          while ($true) {
            $tcp = @(Get-NetTCPConnection -ErrorAction SilentlyContinue)
            $free = [int]((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024)
            $pool = [int]((Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory).PoolNonpagedBytes / 1MB)
            $line = '{0} chrome {1} node {2} tcp {3} bound {4} time-wait {5} free {6} MB nonpaged {7} MB' -f (Get-Date -Format 'HH:mm:ss'), @(Get-Process chrome -ErrorAction SilentlyContinue).Count, @(Get-Process node -ErrorAction SilentlyContinue).Count, $tcp.Count, @($tcp | Where-Object { $_.State -eq 'Bound' }).Count, @($tcp | Where-Object { $_.State -eq 'TimeWait' }).Count, $free, $pool
            Add-Content -Path "$env:RUNNER_TEMP\net.log" -Value $line
            Start-Sleep -Seconds 60
          }
          '@
          Set-Content -Path "$env:RUNNER_TEMP\net-sampler.ps1" -Value $sampler
          Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-File', "$env:RUNNER_TEMP\net-sampler.ps1"
      # the tests read the demo deck, hence a talk made with "Use this template" checks only its deck
      # npm test with the shard of the job, an option that is read only before the files. With
      # --test-force-exit, a test file that leaves a server open after a failed cleanup is ended, and
      # with --test-timeout, a test file that does not end fails by name after 20 minutes
      - run: node --test --test-force-exit --test-timeout=1200000 --test-shard=${{ matrix.shard }}/4 "test/*.test.mjs"
        if: ${{ github.repository == 'beeson-group/slides' }}
      - if: ${{ always() && runner.os == 'Windows' && github.repository == 'beeson-group/slides' }}
        continue-on-error: true
        run: |
          netsh int ipv4 show dynamicport tcp
          Get-Content "$env:RUNNER_TEMP\net.log"

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chrome }
          - { os: ubuntu-latest, browser: firefox }
          - { os: macos-latest, browser: chrome }
          - { os: macos-latest, browser: safari }
          - { os: windows-latest, browser: chrome }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      # the Chrome preinstalled on each runner is found in scripts/chrome.mjs
      - run: npm run check
        if: ${{ matrix.browser == 'chrome' }}
      # Firefox on Linux has WebGL in software only in a window, hence Xvfb
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run check -- --browser firefox --out check/firefox
        if: ${{ matrix.browser == 'firefox' }}
      - run: sudo safaridriver --enable && npm run check -- --browser safari --out check/safari
        if: ${{ matrix.browser == 'safari' }}
      - run: npm run pdf
        if: ${{ !cancelled() && matrix.browser == 'chrome' }}
      - run: npm run pptx
        if: ${{ !cancelled() && matrix.browser == 'chrome' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: slides-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            check/**/*.png
            slides.pdf
            slides.pptx
          if-no-files-found: warn
