name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # the tests run one file at a time on macOS, see below
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run typecheck
      # the Chrome preinstalled on each runner is found in scripts/chrome.mjs
      # the 3 cores of the macOS runner draw Chrome in software, hence one test file at a time there
      - run: npm test -- ${{ matrix.os == 'macos-latest' && '--test-concurrency=1' || '' }}
      - run: npm run check
      # Firefox on Linux has WebGL in software only in a window, hence Xvfb
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run check -- --browser firefox --out check/firefox
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
      - run: sudo safaridriver --enable && npm run check -- --browser safari --out check/safari
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
      - run: npm run pdf
        if: ${{ !cancelled() }}
      - run: npm run pptx
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: slides-${{ matrix.os }}
          path: |
            check/**/*.png
            slides.pdf
            slides.pptx
          if-no-files-found: warn
